    <h3>用語</h3><br>
    <p>
        <b>SSS</b><br>
        本軸名『ポケットモンスター Spesical　Second Shooting Stars!』の略。読み方は「エスエスエス」だったり「トリプルエス」だったりする。</p>

        <p><b>ACTⅠ/ACTⅡ</b><br>
        SSS本編のうち第一章～第四章をACTⅠ、第五章から第七章をACTⅡと区切る。ACTⅠとACTⅡの間にはおよそ四年程度の空白期間がある。</p>

        <p><b>全国ポケモン図鑑協会</b><br>
        本編にはあまり関わってこない。物語の裏で色々ポケモンの情報を編集して図鑑にまとめている組織。次世代ポケモン図鑑に関係するプロジェクトの開発・支援に関わっている。</p>
