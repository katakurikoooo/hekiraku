            <p class="doc-meta">ネバーランド研究部門 / 内部配布資料</p>
        </header>

        <hr class="doc-divider">

        <div class="doc-body">
            <p>一、各ロッジは本部との定期連絡を怠らないこと。<br>
            一、研究資料および実験記録は、指定された保管場所にて管理すること。施設外への持ち出しは原則として禁止する。<br>
            一、施設の存在を外部に漏らすことのないよう、周辺住民および関係者との接触には十分注意すること。<br>
            一、被験体の移送については、必ず本部の許可を得ること。<br>
            一、緊急時には施設の保全よりも研究成果の保全を優先すること。</p>

            <p>なお、本部との連絡が途絶した場合においても、各ロッジは独自の判断によって研究を継続する権限を有する。</p>

            <p style="text-align: right;">研究管理部</p>
